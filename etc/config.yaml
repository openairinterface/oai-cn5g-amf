# OAI CN Configuration File
### This file can be used by all OAI NFs
### Some fields are specific to an NF and will be ignored by other NFs
### The {{ env['ENV_NAME'] }} syntax lets you define these values in a docker-compose file
### If you intend to mount this file or use a bare-metal deployment, please refer to README.md
### The README.md also defines default values and allowed values for each configuration parameter

############# Common configuration

# Log level for all the NFs
log_level:
  general: debug

# If you enable registration, the other NFs will use the NRF discovery mechanism
register_nf:
  general: yes

http_version: 2

############## SBI Interfaces
### Each NF takes its local SBI interfaces and remote interfaces from here, unless it gets them using NRF discovery mechanisms
nfs:
  amf:
    host: oai-amf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
    n2:
      interface_name: eth0
      port: 38412
  smf:
    host: oai-smf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
    n4:
      interface_name: eth0
      port: 8805
  udm:
    host: oai-udm
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  udr:
    host: oai-udr
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  ausf:
    host: oai-ausf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  nrf:
    host: oai-nrf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  pcf:
    host: oai-pcf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  nssf:
    host: oai-nssf
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0


#### Common for UDR and AMF
database:
  host: mysql
  user: test
  type: mysql
  password: test
  database_name: oai_db
  connection_timeout: 300 # seconds

############## NF-specific configuration
amf:
  amf_name: "OAI-AMF"
  # This really depends on if we want to keep the "mini" version or not
  support_features_options:
    enable_simple_scenario: no #"no" by default with the normal deployment scenarios with AMF/SMF/UPF/AUSF/UDM/UDR/NRF. 
                               # set it to "yes" to use with the minimalist deployment scenario (including only AMF/SMF and UPF) by using the internal AUSF/UDM implemented inside AMF. 
                               # There's no NRF in this scenario, SMF info is taken from "nfs" section.
    enable_nssf: no
    enable_advanced_features: no # set it to yes to enable such advanced features e.g., SUCI support, SMF Selection Subscription Data Retrieval,   
                                 # UE Context in SMF Data Retrieval, AMF Registration for 3GPP Access
  relative_capacity: 30
  statistics_timer_interval: 20  #in seconds
  emergency_support: false
  served_guami_list:
    - mcc: 208
      mnc: 95
      amf_region_id: 01
      amf_set_id: 001
      amf_pointer: 01
    - mcc: 001
      mnc: 01
      amf_region_id: 01
      amf_set_id: 001
      amf_pointer: 01
  plmn_support_list:
    - mcc: 208
      mnc: 95
      tac: 0xa000
      nssai:
        - sst: 1
        - sst: 1
          sd: 000001 # in hex
        - sst: 222
          sd: 00007B # in hex
  supported_integrity_algorithms:
    - "NIA0"
    - "NIA1"
    - "NIA2"
  supported_encryption_algorithms:
    - "NEA0"
    - "NEA1"
    - "NEA2"
  paging:
    # T3513: Network-triggered service request supervision (TS 24.501 §5.6.2.2.1).
    # Range 1..60 s. Operator-discretionary; 6 s is a common FR1/TDD starting point.
    t3513_interval_sec: 6
    # 0 = no discretionary retransmissions before PPF=FALSE (TS 24.501 §5.6.2.2.1 allows 0).
    t3513_max_retransmissions: 0
    # T3565: Notification procedure timer (TS 24.501 §5.6.3.4). Body building is
    # deferred; knob is parsed now so reconfig does not require code change.
    t3565_interval_sec: 6
    t3565_max_retransmissions: 4  # TS 24.501 §5.6.3.4 default
    # Staged paging: attempt narrow (registration-area) scope first, then widen
    # to full tracking-area scope (TS 23.502 §4.2.3.3).
    staged_paging_enabled: true
    # How long to wait for a response from the narrow-scope attempt before widening.
    narrow_paging_first_hop_timeout_sec: 4
    # NGAP Paging Priority IE is encoded only when arp.priorityLevel <= this value
    # (TS 23.501 §5.6.3 / TS 23.502 §4.2.3.3 NOTE 4). Range 1..15.
    arp_priority_threshold_for_pri_paging: 8
    # Default paging DRX cycle sent to gNBs (TS 38.413 id-PagingDRX).
    # Accepted values: v32, v64, v128, v256 (radio frames).
    default_paging_drx: v128
    # Number of initial retransmissions that use the OLD 5G-S-TMSI before
    # switching to the new one. Per TS 24.501 §5.5.1.3.8 NOTE, threshold is
    # implementation-defined. Range 0..10. Default 2.
    narrow_attempts_using_old_5g_stmsi: 2    
    max_transactions_per_ue: 8
    registration_defer_timeout_sec: 30
    temporary_unreachable_defer_timeout_sec: 30
    enable_subscription_notifications: yes
    enable_extended_ngap_ies: yes

smf:
  ue_mtu: 1500
  support_features:
    use_local_subscription_info: yes # Use infos from local_subscription_info or from UDM
    use_local_pcc_rules: yes # Use infos from local_pcc_rules or from PCF
  # we resolve from NRF, this is just to configure usage_reporting
  upfs:
    - host: oai-spgwu
      config:
        enable_usage_reporting: no
  ue_dns:
    primary_ipv4: "172.21.3.100"
    primary_ipv6: "2001:4860:4860::8888"
    secondary_ipv4: "8.8.8.8"
    secondary_ipv6: "2001:4860:4860::8888"
  ims:
    pcscf_ipv4: "127.0.0.1"
    pcscf_ipv6: "fe80::7915:f408:1787:db8b"
  # the DNN you configure here should be configured in "dnns"
  local_subscription_infos:
    - single_nssai:
        sst: 1
      dnn: "oai"
      qos_profile:
        5qi: 9
        session_ambr_ul: "200Mbps"
        session_ambr_dl: "400Mbps"
    - single_nssai:
        sst: 1
        sd: 1
      dnn: "oai.ipv4"
      qos_profile:
        5qi: 9
        session_ambr_ul: "100Mbps"
        session_ambr_dl: "200Mbps"
    - single_nssai:
        sst: 222
        sd: 123
      dnn: "default"
      qos_profile:
        5qi: 9
        session_ambr_ul: "50Mbps"
        session_ambr_dl: "100Mbps"

## DNN configuration
dnns:
  - dnn: "oai"
    pdu_session_type: "IPV4"
    ipv4_pool: "12.1.1.151 - 12.1.1.253"
  - dnn: "oai.ipv4"
    pdu_session_type: "IPV4"
    ipv4_pool: "12.1.1.51 - 12.1.1.150"
  - dnn: "default"
    pdu_session_type: "IPV4"
    ipv4_pool: "12.1.1.2 - 12.1.1.50"
  - dnn: "ims"
    pdu_session_type: "IPV4V6"
    ipv4_pool: "14.1.1.2 - 14.1.1.253"

pcf:
  local_policy:
    policy_decisions_path: /openair-pcf/policies/policy_decisions
    pcc_rules_path: /openair-pcf/policies/pcc_rules
    traffic_rules_path: /openair-pcf/policies/traffic_rules

nssf:
  slice_config_path: /openair-nssf/etc/nssf_slice_config.yaml
